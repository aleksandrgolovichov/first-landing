<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>

<h2>FillForm</h2>

<form action="" method="post" novalidate>
    {{ form.hidden_tag() }}
    <p>
        {{ form.username.label }} <br>
        {{ form.username(size = 40) }}
    </p>

    <p>
        {{ form.email.label }} <br>
        {{ form.email(size = 40) }}
    </p>

    <p>
        {{ form.body.label }} <br>
        {{ form.body(size = 80) }}
    </p>

    <p>
        {{ form.submit() }}
    </p>
</form>

</body>
</html>
