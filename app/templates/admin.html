<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Dashboard — A.Golovichov">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="color-scheme" content="dark">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/icon.png') }}">
  <title>Admin Dashboard — A.Golovichov</title>
</head>
<body>
  <!-- Фоновые свечения в том же стиле -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <!-- Шапка сайта -->
  <header class="header" style="min-height: auto;">
    <div class="container">
      <nav class="header__inner glass-nav">
        <div class="header__brand">
           <a class="brand-logo" href="{{ url_for('index') }}">A.Golovichov</a>
        </div>

        <ul class="header__list" id="glass-nav">
          <li class="header__list-item"><a class="header__list-link" href="{{ url_for('index') }}">Home</a></li>
          <li class="header__list-item"><a class="header__list-link" href="{{ url_for('admin_requests') }}">Admin Panel</a></li>
        </ul>

        <div class="header__socials">
          <a class="social-link" target="_blank" href="https://www.instagram.com/nexora_9/">
            <img src="{{ url_for('static', filename='images/inst.svg') }}" alt="" width="20" height="20" />
          </a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Основной блок с заявками -->
  <main class="main" style="padding-top: 40px; padding-bottom: 60px;">
    <section class="contact-section" style="padding: 40px 0;">
      <div class="container">
        <h2 class="section-title">Client Requests</h2>

        <div class="contact__inner glass-card" style="max-width: 900px;">
          {% if requests %}
            <div style="display: flex; flex-direction: column; gap: 20px;">
              {% for req in requests %}
                <div class="glass-card" style="padding: 24px; background: rgba(255, 255, 255, 0.02);">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
                    <h3 style="font-size: 18px; font-weight: 700; margin: 0; color: #ffffff;">{{ req.username }}</h3>
                    <span class="project-tag" style="margin: 0;">{{ req.project_type }}</span>
                  </div>
                  <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 8px;">
                    <strong>Contact:</strong> <a href="mailto:{{ req.email }}" style="color: #ffffff; text-decoration: underline;">{{ req.email }}</a>
                  </p>
                  <p style="color: var(--text-main); font-size: 15px; line-height: 1.5; margin: 0; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px;">
                    {{ req.body }}
                  </p>
                </div>
              {% endfor %}
            </div>
          {% else %}
            <p class="contact__desc" style="margin: 0;">No project requests found yet.</p>
          {% endif %}
        </div>

      </div>
    </section>
  </main>

  <!-- Подвал сайта -->
  <footer class="footer">
    <div class="container">
      <p class="footer_text">Admin Dashboard &copy; A.Golovichov</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
